<section class="page">

    <div class="page-header">
        <h1>Network</h1>
        <p>Configure your router's network interfaces.</p>
    </div>

    <!-- Internet Status -->

    <div class="card-grid">

        <div class="card">
            <span>Internet</span>
            <h2 id="wanStatus" class="card-metric">--</h2>
        </div>

        <div class="card">
            <span>WAN Interface</span>
            <h2 id="wanInterface" class="card-value">--</h2>
        </div>

        <div class="card">
            <span>Connection</span>
            <h2 id="wanType" class="card-value">--</h2>
        </div>

        <div class="card">
            <span>Default Gateway</span>
            <h2 id="wanGateway" class="card-value">--</h2>
        </div>

    </div>

    <div style="margin-top:24px;"></div>

    <!-- Interfaces -->

    <div id="interfaceContainer"></div>

    <!-- Confirmation Modal -->

    <div id="confirmModal" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">
                <h2>Apply Network Changes</h2>
                <button id="modalClose" class="icon-btn">×</button>
            </div>

            <div class="modal-body">

                <p>You're about to apply the following changes.</p>

                <div id="modalBody"></div>

                <div class="modal-warning">
                    <strong>Warning</strong>
                    Incorrect settings may temporarily disconnect the router.
                </div>

            </div>

            <div class="modal-actions">

                <button id="modalCancel" class="secondary-btn">
                    Cancel
                </button>

                <button id="modalConfirm" class="save-btn">
                    Apply
                </button>

            </div>

        </div>

    </div>

</section>

<!-- Interface Card -->

<template id="interfaceTemplate">

    <div class="card interface-card">

        <div class="interface-header">

            <div>
                <h2 class="interface-name"></h2>
                <p class="interface-type"></p>
                <p class="interface-mode"></p>
            </div>

        </div>

        <div class="settings-grid">

            <div class="setting-field">
                <label>Mode</label>
                <select class="setting-input interface-mode-select">
                    <option value="DHCP Client">DHCP Client</option>
                    <option value="Static">Static</option>
                </select>
            </div>

            <div class="setting-field">
                <label>IP Address</label>
                <input class="setting-input interface-ip" type="text">
            </div>

            <div class="setting-field">
                <label>Subnet Mask</label>
                <input class="setting-input interface-subnet" type="text">
            </div>

            <div class="setting-field">
                <label>Gateway</label>
                <input class="setting-input interface-gateway" type="text">
            </div>

            <div class="setting-field">
                <label>Primary DNS</label>
                <input class="setting-input interface-dns" type="text">
            </div>

        </div>

        <div class="interface-footer">
            <button class="save-btn interface-save" disabled>
                Apply
            </button>
        </div>

    </div>

</template>
