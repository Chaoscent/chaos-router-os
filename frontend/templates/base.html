<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Router OS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">Chaos Router OS</div>

        <nav>
            <a href="#/dashboard" data-route="dashboard">Dashboard</a>
            <a href="#/network" data-route="network">Network</a>
            <a href="#/clients" data-route="clients">Clients</a>
            <a href="#/vpn" data-route="vpn">VPN</a>
            <a href="#/modem" data-route="modem">Modem</a>
            <a href="#/logs" data-route="logs">Logs</a>
            <a href="#/system" data-route="system">System</a>

            <hr class="sidebar-divider">

            <a href="#/apps" data-route="apps">Apps</a>
        </nav>

    </aside>

    <main>

        <header class="chaos-header">

            <div class="header-row">

                <div class="header-left">

                    <div class="status online">Online</div>

                    <div class="header-item">
                        <span>Network</span>
                        <strong id="headerNetwork">5G</strong>
                    </div>

                    <div class="header-item">
                        <span>WWAN Module</span>
                        <strong id="headerModule">--</strong>
                    </div>

                    <div class="header-item">
                        <span>Carrier</span>
                        <strong id="headerCarrier">Chaos Mock</strong>
                    </div>

                </div>

                <div class="header-right">

                    <div class="header-item">
                        <span>Ping</span>
                        <strong id="headerPing">-- ms</strong>
                    </div>

                    <div class="header-item">
                        <span>Time</span>
                        <strong id="headerTime">--:--</strong>
                    </div>

                    <div class="header-item">
                        <span>User</span>
                        <strong id="headerUser">admin</strong>
                    </div>

                    <button class="logout-btn" onclick="location.href='/logout'">
                        Logout
                    </button>

                </div>

            </div>

            <div class="network-pulse">

                <div class="pulse-track">
                    <div class="pulse-fill" id="pulseFill"></div>
                </div>

                <div class="pulse-info">
                    <span id="pulseDown">↓ 0 Mbps</span>
                    <span id="pulseUp">↑ 0 Mbps</span>
                </div>

            </div>

        </header>

        <div id="content"></div>

    </main>

</div>

<script src="{{ url_for('static', filename='js/header.js') }}"></script>
<script src="{{ url_for('static', filename='js/router.js') }}"></script>

</body>
</html>
