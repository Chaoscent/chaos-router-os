<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Chaos Router OS</title>
    <link rel="icon" sizes="16x16 32x32 48x48" href="{{ asset('favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ asset('favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">

    <link rel="stylesheet" href="{{ asset('css/style.css') }}">
</head>
<body>

<div class="app">

    <aside id="sidebar" class="sidebar">

        <div class="logo">Chaos Router OS</div>

        <nav>
            <a href="#/dashboard" data-route="dashboard" data-group="overview">Dashboard</a>

            <hr class="sidebar-divider">

            <a href="#/modem" data-route="modem" data-group="network">Modem</a>
            <a href="#/network" data-route="network" data-group="network">Network</a>
            <a href="#/wifi" data-route="wifi" data-group="network">WiFi</a>
            <a href="#/dhcp" data-route="dhcp" data-group="network">DHCP</a>
            <a href="#/dns" data-route="dns" data-group="network">DNS</a>
            <a href="#/clients" data-route="clients" data-group="network">Clients</a>

            <hr class="sidebar-divider">

            <a href="#/firewall" data-route="firewall" data-group="security">Firewall</a>
            <a href="#/vpn" data-route="vpn" data-group="security">VPN</a>

            <hr class="sidebar-divider">

            <a href="#/logs" data-route="logs" data-group="system">Logs</a>
            <a href="#/system" data-route="system" data-group="system">System</a>
            <a href="#/shell" data-route="shell" data-group="system" class="nav-desktop-only"
               data-mobile-title="The shell needs a computer with a keyboard">Shell</a>

            <hr class="sidebar-divider">

            <a href="#/apps" data-route="apps" data-group="apps">Apps</a>
        </nav>

        <footer class="sidebar-credits">
            Made by
            <a href="https://chaos-software.dev" target="_blank" rel="noopener">Chaoscent</a> -
            <a href="https://github.com/chaoscent/chaos-router-os" target="_blank" rel="noopener">GitHub</a>
            <span class="sidebar-version">v{{ app_version }}</span>
        </footer>

    </aside>

    <!-- Phones: tapping outside the open menu closes it. -->
    <div id="navBackdrop" class="nav-backdrop"></div>

    <main>

        <header class="chaos-header">

            <div class="header-row">

                <div class="header-left">

                    <!-- Phones and narrow windows: opens the sidebar. -->
                    <button id="navToggle" class="nav-toggle" type="button"
                            aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             aria-hidden="true">
                            <line x1="4" y1="7" x2="20" y2="7"></line>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="17" x2="20" y2="17"></line>
                        </svg>
                    </button>

                    <div id="headerStatus" class="status">--</div>

                    <div class="header-item">
                        <span>Network</span>
                        <strong id="headerNetwork">--</strong>
                    </div>

                    <div class="header-item">
                        <span>WWAN Module</span>
                        <strong id="headerModule">--</strong>
                    </div>

                    <div class="header-item">
                        <span>Carrier</span>
                        <strong id="headerCarrier">--</strong>
                    </div>

                </div>

                <div class="header-right">

                    <div class="header-item">
                        <span>Ping</span>
                        <strong id="headerPing">-- ms</strong>
                    </div>

                    <div class="header-item">
                        <span>Time</span>
                        <strong id="headerTime">--:--</strong>
                    </div>

                    <div class="header-item">
                        <span>User</span>
                        <strong id="headerUser">admin</strong>
                    </div>

                    <button class="logout-btn" onclick="chaosLogout()">
                        Logout
                    </button>

                </div>

            </div>

            <div class="network-pulse">

                <div class="pulse-track">
                    <div class="pulse-fill" id="pulseFill"></div>
                </div>

                <div class="pulse-info">
                    <span id="pulseDown">↓ 0 Mbps</span>
                    <span id="pulseUp">↑ 0 Mbps</span>
                </div>

            </div>

        </header>

        <!-- Safe apply: unconfirmed changes (see apply.js) -->

        <div id="applyBanner" class="apply-banner hidden" role="alert">

            <div class="apply-text">
                <strong id="applyBannerTitle"></strong>
                <span id="applyBannerCountdown"></span>
                <span id="applyBannerHint" class="apply-hint hidden"></span>
            </div>

            <div class="apply-actions">
                <button id="applyRevert" class="secondary-btn">Revert</button>
                <button id="applyKeep" class="save-btn">Keep changes</button>
            </div>

        </div>

        <div id="applyNotice" class="apply-notice hidden" role="status">
            <span id="applyNoticeText"></span>
            <button id="applyNoticeClose" class="icon-btn" aria-label="Dismiss">×</button>
        </div>

        <div id="content"></div>

    </main>

</div>

<!-- Global Confirmation Modal -->

<div id="confirmModal" class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">
            <h2 id="modalTitle">Confirm Changes</h2>
            <button id="modalClose" class="icon-btn">×</button>
        </div>

        <p id="modalSubtitle" class="modal-subtitle">
            Review your changes before applying them.
        </p>

        <div id="modalBody" class="modal-body"></div>

        <div class="modal-actions">
            <button id="modalCancel" class="secondary-btn">
                Cancel
            </button>

            <button id="modalConfirm" class="save-btn">
                Apply Changes
            </button>
        </div>

    </div>

</div>

<!-- router.js adds this to the page scripts it loads (cache busting). -->
<script>window.ASSET_VERSION = "{{ page_scripts_version() }}";</script>
<script src="{{ asset('js/csrf.js') }}"></script>
<script src="{{ asset('js/header.js') }}"></script>
<script src="{{ asset('js/select.js') }}"></script>
<script src="{{ asset('js/modal.js') }}"></script>
<script src="{{ asset('js/apply.js') }}"></script>
<script src="{{ asset('js/router.js') }}"></script>

</body>
</html>
