<section class="page dashboard">

    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Overview of your router.</p>
    </div>

    <div class="card-grid dashboard-metrics">
        <a href="#/clients" class="card-link">
            <div class="card">
                <span>Connected Clients</span>
                <div class="card-metric" id="clients">--</div>
            </div>
        </a>

        <div class="card">
            <span>Active Clients</span>
            <div class="card-metric" id="active">--</div>
        </div>

        <div class="card">
            <span>Download</span>
            <div class="card-metric" id="download">-- Mbps</div>
        </div>

        <div class="card">
            <span>Upload</span>
            <div class="card-metric" id="upload">-- Mbps</div>
        </div>

    </div>

    <div class="card dashboard-graph">

        <span>Network Activity (60 seconds)</span>

        <!-- dashboard.js draws in a 600x180 space; the SVG stretches to fit. -->
        <svg id="trafficGraph"
             viewBox="0 0 600 180"
             preserveAspectRatio="none"
             width="100%">

            <polyline id="downloadLine"
                fill="none"
                stroke="#4ea1ff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                vector-effect="non-scaling-stroke"/>

            <polyline id="uploadLine"
                fill="none"
                stroke="#6ee7b7"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                vector-effect="non-scaling-stroke"/>

        </svg>

    </div>

    <div class="card-grid dashboard-system">

        <div class="card">
            <span>Hostname</span>
            <div class="card-value" id="hostname">--</div>
        </div>

        <div class="card">
            <span>IP Address</span>
            <div class="card-value" id="ip">--</div>
        </div>

        <div class="card">
            <span>CPU Temp</span>
            <div class="card-value" id="cpu">--</div>
        </div>

        <div class="card">
            <span>RAM</span>
            <div class="card-value" id="ram">--</div>
        </div>

        <div class="card">
            <span>Uptime</span>
            <div class="card-value" id="uptime">--</div>
        </div>

        <div class="card">
            <span>System Time</span>
            <div class="card-value" id="time">--</div>
        </div>

    </div>

</section>
