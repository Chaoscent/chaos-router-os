<section class="page dashboard">

    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Overview of your router.</p>
    </div>

    <div class="card-grid dashboard-metrics">
        <a href="#/clients" class="card-link">
            <div class="card">
                <span>Connected Clients</span>
                <div class="card-metric" id="clients">--</div>
            </div>
        </a>

        <div class="card">
            <span>Active Clients</span>
            <div class="card-metric" id="active">--</div>
        </div>

        <div class="card">
            <span>Download</span>
            <div class="card-metric" id="download">-- Mbps</div>
        </div>

        <div class="card">
            <span>Upload</span>
            <div class="card-metric" id="upload">-- Mbps</div>
        </div>

    </div>

    <div class="card dashboard-graph">

        <div class="graph-header">

            <span>Internet Throughput (last 60 seconds)<span id="graphInterface"></span></span>

            <div class="graph-legend">
                <span class="legend-item"><i class="legend-swatch download"></i>Download</span>
                <span class="legend-item"><i class="legend-swatch upload"></i>Upload</span>
            </div>

        </div>

        <!-- dashboard.js draws axes, lines and the hover cursor at the
             graph's real pixel size, so text never stretches. -->
        <div class="graph-area">

            <svg id="trafficGraph" role="img"
                 aria-label="Download and upload throughput over the last 60 seconds"></svg>

            <div id="graphTooltip" class="graph-tooltip hidden"></div>

        </div>

    </div>

    <div class="card-grid dashboard-system">

        <div class="card">
            <span>Hostname</span>
            <div class="card-value" id="hostname">--</div>
        </div>

        <div class="card">
            <span>CPU Load</span>
            <div class="card-value" id="cpuLoad">--</div>
        </div>

        <div class="card">
            <span>CPU Temp</span>
            <div class="card-value" id="cpu">--</div>
        </div>

        <div class="card">
            <span>RAM</span>
            <div class="card-value" id="ram">--</div>
        </div>

        <div class="card">
            <span>Uptime</span>
            <div class="card-value" id="uptime">--</div>
        </div>

        <div class="card">
            <span>System Time</span>
            <div class="card-value" id="time">--</div>
        </div>

    </div>

</section>
