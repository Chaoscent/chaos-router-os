<section class="page">

    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Overview of your router.</p>
    </div>

    <div class="card-grid">
        <a href="#/clients" class="card-link">
            <div class="card">
                <span>Connected Clients</span>
                <div class="card-metric" id="clients">--</div>
            </div>
        </a>

        <div class="card">
            <span>Active Clients</span>
            <div class="card-metric" id="active">--</div>
        </div>

        <div class="card">
            <span>Download</span>
            <div class="card-metric" id="download">-- Mbps</div>
        </div>

        <div class="card">
            <span>Upload</span>
            <div class="card-metric" id="upload">-- Mbps</div>
        </div>

    </div>

    <div style="height:20px"></div>

    <div class="card">

        <span>Network Activity (60 seconds)</span>

        <svg id="trafficGraph"
             viewBox="0 0 600 180"
             width="100%"
             height="180">

            <polyline id="downloadLine"
                fill="none"
                stroke="#4ea1ff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"/>

            <polyline id="uploadLine"
                fill="none"
                stroke="#6ee7b7"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"/>

        </svg>

    </div>

    <div style="height:20px"></div>

    <div class="card-grid">

        <div class="card">
            <span>Hostname</span>
            <div class="card-value" id="hostname">--</div>
        </div>

        <div class="card">
            <span>IP Address</span>
            <div class="card-value" id="ip">--</div>
        </div>

        <div class="card">
            <span>CPU Temp</span>
            <div class="card-value" id="cpu">--</div>
        </div>

        <div class="card">
            <span>RAM</span>
            <div class="card-value" id="ram">--</div>
        </div>

        <div class="card">
            <span>Uptime</span>
            <div class="card-value" id="uptime">--</div>
        </div>

        <div class="card">
            <span>System Time</span>
            <div class="card-value" id="time">--</div>
        </div>

    </div>

</section>
