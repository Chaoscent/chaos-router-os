<section class="page">

    <div class="page-header">
        <h1>System</h1>
        <p>System configuration and device settings.</p>
    </div>


    <div class="system-sections">


        <!-- Hostname -->

        <div class="card">

            <span>Hostname</span>

            <div class="setting-row">

                <input
                    id="hostnameInput"
                    class="setting-input"
                    type="text"
                    placeholder="Hostname">

                <button
                    id="saveHostname"
                    class="save-btn">
                    Save
                </button>

            </div>

            <div id="hostnameStatus" class="setting-status">
                Changes apply immediately.
            </div>

        </div>


        <!-- Security -->

        <div class="card">

            <span>Security</span>


            <div class="setting-group">

                <label for="idleTimeoutInput">
                    Idle session timeout
                </label>

                <div class="setting-row">

                    <input
                        id="idleTimeoutInput"
                        class="setting-input"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Default: 5 minutes">

                    <span>minutes</span>

                </div>

            </div>


            <div class="setting-group">

                <label for="absoluteTimeoutInput">
                    Absolute session lifetime
                </label>

                <div class="setting-row">

                    <input
                        id="absoluteTimeoutInput"
                        class="setting-input"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Default: 60 minutes">

                    <span>minutes</span>

                </div>

            </div>


            <div class="setting-row">

                <button
                    id="saveSecurity"
                    class="save-btn">
                    Save
                </button>

            </div>

            <div
                id="securityStatus"
                class="setting-status">
            </div>

        </div>


        <!-- Ping -->

        <div class="card">

            <span>Ping</span>


            <div class="setting-group">

                <label for="pingEnabledInput">
                    Ping display
                </label>

                <div class="setting-row">

                    <select
                        id="pingEnabledInput"
                        class="setting-input">

                        <option value="false">
                            Disabled
                        </option>

                        <option value="true">
                            Enabled
                        </option>

                    </select>

                </div>

            </div>


            <div class="setting-group">

                <label for="pingIntervalInput">
                    Ping interval
                </label>

                <div class="setting-row">

                    <select
                        id="pingIntervalInput"
                        class="setting-input">

                        <option value="5">
                            5 seconds
                        </option>

                        <option value="10">
                            10 seconds
                        </option>

                        <option value="30">
                            30 seconds
                        </option>

                        <option value="60">
                            60 seconds
                        </option>

                    </select>

                </div>

            </div>


            <div class="setting-row">

                <button
                    id="savePing"
                    class="save-btn">
                    Save
                </button>

            </div>

            <div
                id="pingStatus"
                class="setting-status">
            </div>

        </div>


        <!-- Change Password -->

        <div class="card">

            <span>Change Password</span>


            <div class="setting-group">

                <label for="currentPasswordInput">
                    Current password
                </label>

                <input
                    id="currentPasswordInput"
                    class="setting-input"
                    type="password"
                    autocomplete="current-password">

            </div>


            <div class="setting-group">

                <label for="newPasswordInput">
                    New password
                </label>

                <input
                    id="newPasswordInput"
                    class="setting-input"
                    type="password"
                    autocomplete="new-password">

            </div>


            <div class="setting-group">

                <label for="confirmPasswordInput">
                    Confirm new password
                </label>

                <input
                    id="confirmPasswordInput"
                    class="setting-input"
                    type="password"
                    autocomplete="new-password">

            </div>


            <div class="setting-row">

                <button
                    id="changePassword"
                    class="save-btn">
                    Change Password
                </button>

            </div>


            <div
                id="passwordStatus"
                class="setting-status">

            </div>

        </div>


    </div>

</section>
