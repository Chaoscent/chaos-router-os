<section class="page">

    <div class="page-header">
        <h1>System</h1>
        <p>System configuration and device settings.</p>
    </div>

    <div class="card">

        <span>Hostname</span>

        <div class="setting-row">

            <input
                id="hostnameInput"
                class="setting-input"
                type="text"
                placeholder="Hostname">

            <button
                id="saveHostname"
                class="save-btn">
                Save
            </button>

        </div>

        <div id="hostnameStatus" class="setting-status">
            Changes apply immediately.
        </div>

    </div>

</section>
