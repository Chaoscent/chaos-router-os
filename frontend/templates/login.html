<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Chaos Router OS</title>
<link rel="icon" sizes="16x16 32x32 48x48" href="{{ asset('favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ asset('favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">

<link rel="stylesheet" href="{{ asset('css/style.css') }}">

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-card{
    width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px;
}

.login-card h1{
    margin-bottom:8px;
}

.login-card p{
    margin-bottom:24px;
    color:var(--muted);
}

.login-card input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    color:white;
}

.login-card button{
    width:100%;
    padding:14px;
    border:1px solid transparent;
    border-radius:12px;
    background:var(--accent);
    color:white;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease,opacity .18s ease;
}

.login-card button:hover:not(:disabled){
    background:#60aaff;
    border-color:#70b3ff;
    box-shadow:0 5px 18px rgba(78,161,255,.20);
}

.login-card button:active:not(:disabled){
    transform:scale(.98);
}

.login-card button:focus-visible{
    outline:2px solid #70b3ff;
    outline-offset:2px;
}

.login-card button:disabled{
    opacity:.7;
    cursor:wait;
}

.login-card button.busy::before{
    content:"";
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:white;
    border-radius:50%;
    animation:loginSpin .7s linear infinite;
}

@keyframes loginSpin{
    to{
        transform:rotate(360deg);
    }
}

#error{
    margin-top:12px;
    color:#ff7b7b;
    display:none;
}
</style>
</head>

<body>

<div class="login-card">

<h1>Chaos Router OS</h1>
<p>Sign in to manage your router.</p>

<input id="username" value="admin" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button id="loginButton" onclick="login()">Sign In</button>

<div id="error">Invalid username or password.</div>

</div>

<script src="{{ asset('js/csrf.js') }}"></script>

<script>
async function login(){

    if(loginButton.disabled) return;

    loginButton.disabled = true;
    loginButton.classList.add("busy");
    loginButton.textContent = "Signing in…";
    error.style.display = "none";

    let res = null;

    try{
        res = await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username:username.value,
                password:password.value
            })
        });
    }catch(e){
        res = null;
    }

    if(res && res.ok){
        location.href="/";
        return;
    }

    let message = "Could not reach the router.";

    if(res){
        try{
            message = (await res.json()).message || "Invalid username or password.";
        }catch{
            message = "Invalid username or password.";
        }
    }

    error.textContent = message;

    error.style.display = "block";

    loginButton.disabled = false;
    loginButton.classList.remove("busy");
    loginButton.textContent = "Sign In";
}

password.addEventListener("keydown",e=>{
    if(e.key==="Enter") login();
});
</script>

</body>
</html>
