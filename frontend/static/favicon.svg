<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chaos Router OS icon: a router node linked to three devices.
       Drawn for this project, no third-party artwork. -->
  <rect width="64" height="64" rx="14" fill="#181c25"/>
  <g stroke="#4ea1ff" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="34" x2="32" y2="13"/>
    <line x1="32" y1="34" x2="14" y2="49"/>
    <line x1="32" y1="34" x2="50" y2="49"/>
  </g>
  <circle cx="32" cy="13" r="6" fill="#e8eef7"/>
  <circle cx="14" cy="49" r="6" fill="#e8eef7"/>
  <circle cx="50" cy="49" r="6" fill="#e8eef7"/>
  <circle cx="32" cy="34" r="9" fill="#4ea1ff"/>
</svg>
