# Nextcloud with MariaDB. The database passwords are generated per
# router (app.env). Caddy on the router forwards to the published
# port; Docker's networks are trusted as proxies.
services:
  nextcloud:
    image: nextcloud:stable
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${CHAOS_PORT}:80"
    volumes:
      - "${CHAOS_DATA}/html:/var/www/html"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      NEXTCLOUD_TRUSTED_DOMAINS: "${CHAOS_HOST}"
      TRUSTED_PROXIES: "172.16.0.0/12"
      TZ: "${TZ}"

  db:
    image: mariadb:lts
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - "${CHAOS_DATA}/db:/var/lib/mysql"
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      TZ: "${TZ}"
